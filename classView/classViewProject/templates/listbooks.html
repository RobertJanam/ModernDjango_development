<html>
<head>
    <style>
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .container {
            max-width: 1000px;
            padding: 30px;
        }

        .action-button {
            margin-bottom: 20px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
        }

        th, td {
            text-align: left;
            border-bottom: 1px solid rgb(224, 223, 223);
        }

        th {
            background-color: #f1f3f5;
            color: #495057;
        }

        .btn {
            display: inline-block;
            border-radius: 4px;
            text-decoration: none;
        }

        .btn-add {
            background-color: #20b2aa;
            color: white;
            font-size: 1rem;
            padding: 10px 20px;
        }

        .btn-add:hover { 
            background-color: #19938d;
        }

        .btn-detail {
            background-color: #e3fafc;
            color: #0b7285;
        }

        .btn-detail:hover {
            background-color: #c5f6fa;
        }

        .btn-update {
            background-color: #fff4e6;
            color: #d9480f;
        }

        .btn-update:hover {
            background-color: #ffe8cc;
        }

        .btn-delete {
            background-color: #fff5f5;
            color: #c92a2a;
        }

        .btn-delete:hover {
            background-color: #ffe3e3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mireri's BookShelf</h1>
        
        <div class="action-button">
            <a href="{% url 'add_book' %}" class="btn btn-add">Add New</a>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>TITLE</th>
                        <th>AUTHOR</th>
                        <th>PRICE</th>
                        <th>DETAILS</th>
                        <th>UPDATE</th>
                        <th>DELETE</th>
                    </tr>
                </thead>
                <tbody>
                    {% for book in books %}
                    <tr>
                        <td><strong>{{ book.title }}</strong></td>
                        <td>{{ book.author }}</td>
                        <td>${{ book.price }}</td>
                        <td><a href="{% url 'list_book' book.id %}" class="btn btn-detail">Detail</a></td>
                        <td><a href="{% url 'update_book' book.id %}" class="btn btn-update">Update</a></td>
                        <td><a href="{% url 'delete_book' book.author %}" class="btn btn-delete">Delete</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
